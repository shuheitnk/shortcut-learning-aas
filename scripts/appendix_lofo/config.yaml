# Appendix - LOFO against the Rubber Ruler Test. Read by ./run_appendix_lofo.py.
# Everything but the LOFO cells is resolved from the stage store as in Experiment 4.

id: appendix_lofo
preset: full

problem_classes: [bbob]

overrides:
