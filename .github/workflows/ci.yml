name: CI

# Builds the dev container and runs the quality gate and the debug-scale
# preanalysis in it. Only on main and by hand, to save runner minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  container:
    # Pinned rather than ubuntu-latest, which moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The image (~11 GB, mostly CUDA torch) does not fit otherwise; these are
        # preinstalled tool caches the job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost
          docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - name: Build the container and run the checks in it
        # Deep-ELA's weights first, so its tests run rather than skip. The required
        # tests run the debug preanalysis from empty and check a rerun computes nothing.
        uses: devcontainers/ci@v0.3
        with:
          imageName: shortcut-learning-aas
          push: never
          runCmd: >-
            just vendor-deep-ela
            && just check
            && uv run python -m pytest tests/test_required.py -q
